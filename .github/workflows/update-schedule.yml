name: Auto-Update Schedule

on:
  schedule:
    # Runs every day at 00:00 UTC (07:00 Novosibirsk time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual run button in GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd server && npm install
          cd ..
          npm install tsx --no-save

      - name: Scrape & Parse Latest Timetable
        run: npx tsx scripts/update_schedule.ts || echo "[Warning] University site unreachable or rate limited; preserving current schedule."
        env:
          NODE_PATH: server/node_modules

      - name: Commit and push if changed
        id: commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json vk-mini-app/public/schedule.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(schedule): auto-update timetable from NGHU site [skip ci]"
            git push || echo "[Warning] Git push skipped."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build VK Mini App
        if: steps.commit.outputs.changed == 'true'
        run: |
          cd vk-mini-app
          npm ci
          npm run build

      - name: Deploy to gh-pages branch
        if: steps.commit.outputs.changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: vk-mini-app/dist
          branch: gh-pages
