name: Auto-Update Schedule

on:
  schedule:
    # Runs every day at 00:00 UTC (07:00 Novosibirsk time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual run button in GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd server && npm install
          npm install

      - name: Scrape & Parse Latest Timetable
        run: npx tsx scripts/update_schedule.ts

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule.json vk-mini-app/public/schedule.json
          git diff --cached --quiet || (git commit -m "chore(schedule): auto-update timetable from NGHU site [skip ci]" && git push)
